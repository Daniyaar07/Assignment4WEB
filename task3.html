<body>
    <nav class="text-center mt-4">
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>

    </nav>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Contact Form Validation</h1>
        <form class="mx-auto p-4 border rounded was-validated" style="max-width: 600px;" >
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" id="name" name="name" class="form-control" required>

                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Enter a valid email</div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message:</label>
                <textarea id="message" class="form-control" required></textarea>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Message is required</div>
            </div>
            <button type="submit" class="btn btn-dark">Submit</button>
        </form>
    </div>
</body>
</html>
