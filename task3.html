<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task3.css">
</head>
<body>
    <nav class="text-center mt-4">
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </nav>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Contact Form Validation</h1>
        <form class="mx-auto p-4 border rounded" style="max-width: 600px;" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" id="name" name="name" class="form-control" required>

                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Enter a valid email</div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message:</label>
                <textarea id="message" class="form-control" required></textarea>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Message is required</div>
            </div>
            <button type="submit" class="btn btn-dark">Submit</button>
        </form>
    </div>
    <script>
        let form = document.querySelector('form');
        form.addEventListener("submit", function(event){
            event.preventDefault();
            let inputs = document.querySelectorAll(".form-control");
            for(let input of inputs){
                if(input.checkValidity()){
                    input.classList.add("is-valid");
                    input.classList.remove("is-invalid");
                }
                else{
                    input.classList.add("is-invalid");
                    input.classList.remove("is-valid");
                }
            }
        });
    </script>
</body>
</html>
