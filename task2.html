    <div class="container mt-5">
        <h1 class="text-center mb-4">Contact Form </h1>

        <form class="mx-auto p-4 border rounded" style="max-width:600px;">
            <div class="row">
                <div class="col-md-6" mb-3>
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email">
                    <div class="form-text">We will never share your email</div>
                </div>
            </div>
            <div class ="mb-3">
                <label for="message" class="form-label">Message:</label>
                <textarea id="message" name="message" class="form-control" rows="4" placeholder="Enter your message"></textarea>
            </div>
            <button type="submit" class="btn btn-dark">Submit</button>
        </form>
    </div>
</body>
