<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task4.css">
</head>
<body>
    <nav class="text-center mt-4">
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </nav>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Registration Form</h1>
        <form class="mx-auto p-4 border rounded was-validated" style="max-width:600px;" >
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="first" class="form-label">First Name:</label>
                    <input type="text" id="first" class="form-control" required>
                    <div class ="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Required field</div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="last" class="form-label">Last Name:</label>
                    <input type="text" id="last" class="form-control" required>
                    <div class ="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Required field</div>
                </div>
            </div>
            <div class = "mb-3">
                <label for ="email" class="form-label">Email:</label>
                <input type="email" id="email" class="form-control" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Enter a valid email</div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" id="password" class="form-control" minlength="6" required>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Minimum 6 characters</div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="confirm" class ="form-label">Confirm Password:</label>
                    <input type="password" id="confirm" class="form-control" required>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Password must match</div>
                </div>
            </div>
            <div class ="mb-3">
                <label class="form-label">Gender:</label>
                <div>
                    <input type="radio" name="gender" id="male" required>
                    <label for="male">Male</label>

                    <input type="radio" name="gender" id="female">
                    <label for="female">Female</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Hobbies:</label>
                <div>
                    <input type="checkbox" id="sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music">
                    <label for="music">Music</label>
                </div>
            </div>
            <div class="mb-3">
                <label for="country" class="form-label">Country:</label>
                <select id="country" class="form-select" required>
                    <option value="">Choose country</option>
                    <option value="kz">Kazakhstan</option>
                    <option value="us">USA</option>
                </select>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Choose a country</div>
            </div>
            <button type="submit" class="btn btn-dark">Submit</button>
            <button type="reset" class="btn btn-secondary mt-2">Reset</button>
        </form>
    </div>
</body>
</html>
